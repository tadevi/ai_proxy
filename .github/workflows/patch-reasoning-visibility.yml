name: Patch reasoning visibility
on:
  push:
    branches: [feature/external-reasoning-codec]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/external-reasoning-codec
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch modal visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/pages/Connections.tsx')
          s = p.read_text()
          old = """  const usesExternalOpenAI =\n    !requiresCliproxyAccount &&\n    !cliproxyAccountId &&\n    selectedPresets.length > 0 &&\n    selectedPresets.every(\n      (preset) => (apiFormat || preset.apiFormat) === 'openai_compatible',\n    );\n"""
          new = """  const isExternalConnection = !requiresCliproxyAccount && !cliproxyAccountId;\n  const usesExternalOpenAI =\n    isExternalConnection &&\n    selectedPresets.length > 0 &&\n    selectedPresets.every(\n      (preset) => (apiFormat || preset.apiFormat) === 'openai_compatible',\n    );\n"""
          if old not in s:
              raise SystemExit('condition block not found')
          s = s.replace(old, new, 1)
          old2 = """          {usesExternalOpenAI && (\n            <label>\n              <span className=\"label\">Reasoning format</span>\n              <select\n                className=\"input\"\n                onChange={(event) => setReasoningCodec(event.target.value as ReasoningCodec)}\n                value={reasoningCodec}\n              >\n"""
          new2 = """          {isExternalConnection && (\n            <label>\n              <span className=\"label\">Reasoning format</span>\n              <select\n                className=\"input\"\n                disabled={!usesExternalOpenAI}\n                onChange={(event) => setReasoningCodec(event.target.value as ReasoningCodec)}\n                value={reasoningCodec}\n              >\n"""
          if old2 not in s:
              raise SystemExit('field block not found')
          s = s.replace(old2, new2, 1)
          old3 = """              <span className=\"mt-1 block text-xs text-zinc-500\">\n                Applies only to external API-key OpenAI-compatible bindings.\n              </span>\n"""
          new3 = """              <span className=\"mt-1 block text-xs text-zinc-500\">\n                {usesExternalOpenAI\n                  ? 'Applies to the selected external OpenAI-compatible bindings.'\n                  : 'Select OpenAI-compatible presets or override the API format to enable this.'}\n              </span>\n"""
          if old3 not in s:
              raise SystemExit('helper block not found')
          s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm .github/workflows/patch-reasoning-visibility.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/pages/Connections.tsx .github/workflows/patch-reasoning-visibility.yml
          git commit -m 'fix: keep reasoning format visible in binding modal'
          git push origin HEAD:feature/external-reasoning-codec
